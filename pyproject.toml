[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "php54-spl-uaf-rce-chain"
version = "1.1.0"
description = "Reproducible PHP 5.4 SPL heap-leak, arbitrary-read, ASLR-rebase, and RCE lab"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "php54-spl-uaf-rce-chain contributors" }]

[tool.setuptools]
packages = ["poc", "lab", "lab.centos7"]
