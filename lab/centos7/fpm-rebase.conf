[global]
daemonize = no
error_log = /x/fpm-rebase.log
log_level = notice
pid = /x/fpm-rebase.pid

[rebase]
user = root
group = root
listen = 127.0.0.1:9001
listen.allowed_clients = 127.0.0.1
pm = static
pm.max_children = 1
catch_workers_output = yes
php_admin_value[display_errors] = off
php_admin_value[log_errors] = on
php_admin_value[error_log] = /x/fpm-rebase-worker.log
